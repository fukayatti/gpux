[package]
name = "gpux"
version = "0.1.0"
edition = "2024"
description = "React-like DX and Tailwind utility classes for GPUI"
repository = "https://github.com/fukayatti/gpux"
license = "MIT"

[dependencies]
gpux_macros = { path = "core" }
gpui = "0.2.2"
lucide-icons = { version = "0.575.0", features = ["serde"] }
serde_json = "1.0.149"
icondata = { version = "0.7.0", features = ["font-awesome", "heroicons", "lucide", "simple-icons"] }
once_cell = "1.21.4"
ureq = "2.9"
image = "0.25"

[workspace]
members = [
    "core",
    "demo_app"
]
